[project]
name = "mock-llm"
version = "0.1.0"
description = "OpenAI 兼容的 mock LLM 服务器，用于调试 agent 工具调用（执行命令）循环"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["mock_llm"]
