# 演示「按工具清单自动匹配场景」：
# agent 暴露 read_file 工具时自动启用本剧本，与 exec-commands 互不干扰。
# 第 2 步同时下发两个工具调用，演示并行 tool_calls 的流式分片。
name: read-file-demo
description: agent 暴露 read_file 时启用：先读文件，再并行读两个路径，最后总结
requires_tools: [read_file]

steps:
  - tool_calls:
      - name: read_file
        arguments: { path: "/etc/hostname" }

  - tool_calls:
      - name: read_file
        arguments: { path: "/etc/os-release" }
      - name: read_file
        arguments: { path: "/proc/uptime" }

  - content: |
      已完成文件读取，最后读取结果片段：
      {last_tool_result}

default:
  content: 文件读取演示结束。
